<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project details from Mark Laurence Moratalla's digital portfolio.">
  <title>Project details — Mark Laurence Moratalla</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .project-detail-page { min-height: 100svh; padding: 150px var(--gutter) 90px; }
    .project-detail { max-width: 980px; margin: 0 auto; }
    .project-detail h1 { font-size: clamp(3.5rem, 11vw, 9rem); line-height: .85; letter-spacing: -.09em; margin: 18px 0 35px; }
    .project-detail h1 span { color: #858585; }
    .project-detail-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 60px; align-items: start; }
    .project-detail-copy { color: #aaa; font-size: 15px; line-height: 1.8; max-width: 560px; }
    .project-detail-meta { border-top: 1px solid var(--line); padding-top: 20px; font: 10px/2 var(--mono); color: #999; }
    .project-detail-meta strong { display: block; color: #fff; font-weight: 400; }
    .project-detail-links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 35px; }
    @media (max-width: 700px) { .project-detail-page { padding-top: 120px; } .project-detail-grid { grid-template-columns: 1fr; gap: 35px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html#home" aria-label="Back to portfolio home"><span class="brand-mark">MM<span>.</span></span><span class="brand-caption">DIGITAL PORTFOLIO</span></a>
    <a class="header-cta" href="index.html#projects">BACK TO WORK <span>↗</span></a>
  </header>
  <main class="project-detail-page">
    <article class="project-detail">
      <p class="eyebrow"><span class="status-dot"></span><span id="projectType">PROJECT DETAIL</span></p>
      <h1 id="projectTitle">PROJECT<span>.</span></h1>
      <div class="project-detail-grid">
        <div>
          <p class="project-detail-copy" id="projectDescription">Project details will appear here.</p>
          <div class="project-detail-links">
            <a class="button button-light" href="index.html#contact">ASK ABOUT THIS PROJECT <span>↗</span></a>
            <a class="text-link" href="index.html#projects">VIEW ALL WORK <span>↗</span></a>
          </div>
        </div>
        <div class="project-detail-meta" id="projectMeta"></div>
      </div>
    </article>
  </main>
  <script>
    const projects = {
      unicode: { title: "UNI CODE", type: "CAPSTONE PROJECT", description: "A capstone project focused on making programming practice more approachable for students.", meta: "CAPSTONE\nWEB DEVELOPMENT" },
      "cafe-recontre": { title: "CAFE RECONTRE", type: "WEBSITE ACTIVITY", description: "A coffee website activity exploring menu presentation, atmosphere, and responsive layout.", meta: "WEB DESIGN\nFRONT END" },
      "gentle-one": { title: "GENTLE ONE", type: "WEBSITE ACTIVITY", description: "A men's attire website activity built around product presentation and a clean visual identity.", meta: "WEB DESIGN\nE-COMMERCE" },
      quicknotes: { title: "QUICK NOTES", type: "ANDROID STUDIO PROJECT", description: "An Android Studio project for capturing and organizing notes quickly.", meta: "ANDROID\nMOBILE APP" }
    };
    const project = projects[new URLSearchParams(location.search).get("project")] || projects.unicode;
    document.title = `${project.title.replace(" ", "")} — Mark Laurence Moratalla`;
    document.querySelector("#projectTitle").innerHTML = project.title.replace(" ", "<br>") + "<span>.</span>";
    document.querySelector("#projectType").textContent = project.type;
    document.querySelector("#projectDescription").textContent = project.description;
    document.querySelector("#projectMeta").innerHTML = project.meta.split("\n").map(item => `<strong>${item}</strong>`).join("");
  </script>
</body>
</html>
